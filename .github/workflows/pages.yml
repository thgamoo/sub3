# GitHub Pages 배포 — «간단 룰» 웹페이지
#
# main 에 밀면 `demo/` 폴더가 그대로 올라간다.
#   https://thgamoo.github.io/sub3/                 간단 룰 (demo/index.html)
#   https://thgamoo.github.io/sub3/simulator.html   시뮬레이터
#   https://thgamoo.github.io/sub3/summary-card.html 요약 카드
#
# 빌드가 없다. 정적 HTML 한 장이라 올리기만 하면 끝이다 —
# 그래서 «휴대폰에서 확인» 까지 걸리는 시간이 push 뒤 1분 남짓이다.
#
# ⚠️ 처음 한 번은 GitHub 에서 켜줘야 한다:
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**
#   («Deploy from a branch» 로 두면 이 워크플로 결과가 안 쓰인다)

name: 배포

on:
  push:
    branches: [main]
    # 문서만 고쳤을 때까지 배포가 도는 건 낭비다. 올라가는 것이 바뀔 때만 돈다.
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  # 손으로 한 번 돌릴 수 있게 (Pages 를 켠 직후에 쓴다)
  workflow_dispatch:

# Pages 배포에 필요한 권한. 이 셋이 없으면 마지막 단계에서 거절당한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 밀었을 때 뒤엣것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 낱말이 사전에 없으면 «눌렀는데 아무 일도 안 일어나는» 페이지가 된다.
      # 화면에서는 티가 안 나므로 올리기 전에 여기서 잡는다.
      - name: 낱말 링크 확인
        run: python3 demo/check_keywords.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - id: deployment
        uses: actions/deploy-pages@v4
